---
# yamllint disable rule:line-length

name: Tests
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - master
      - release*
    tags:
      - "*"
  pull_request:
    branches:
      - master
      - release*
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  KIND_VERSION: "0.33.0"
  GO111MODULE: "on"
  IMAGE: "quay.io/backube/snapscheduler"
  IMAGE_PLATFORMS: "linux/amd64,linux/arm64,linux/s390x,linux/ppc64le"
  CI_TAG: "ci-build"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install Ruby so that pre-commit markdownlint can run on ubuntu-24
      - name: Setup Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '4.0.8'

      - name: Install pre-commit
        run: |
          python -m pip install --user pre-commit
          echo "PYHASH=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "ImageOS=${ImageOS}" >> $GITHUB_ENV
          echo "ImageVersion=${ImageVersion}" >> $GITHUB_ENV

      - name: Enable cache for pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.ImageOS }}|${{ env.ImageVersion }}|${{ env.PYHASH }}|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit|${{ env.ImageOS }}|${{ env.ImageVersion }}|${{ env.PYHASH }}|
            pre-commit|${{ env.ImageOS }}|${{ env.ImageVersion }}|

      - name: Run pre-commit checks
        run: |
          pre-commit run -a
          pre-commit gc

  codescan:
    name: CodeQL scan
    runs-on: ubuntu-26.04
    permissions:
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Download modules
        run: go mod download

      - name: Build operator
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  build:
    name: Build
    # The build exports a multi-platform OCI archive instead of relying on the
    # runner's Docker/containerd image store. Keep the runner pinned so the
    # toolchain does not drift.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Buildx
        run: |
          # Pin BuildKit by digest: the docker-container driver runs it
          # privileged and it produces the archive that is eventually published.
          docker buildx create --name snapscheduler-builder \
            --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c \
            --use
          docker buildx inspect --bootstrap

      - name: Build operator container
        run: |
          make docker-build-oci \
            IMG="${IMAGE}:${CI_TAG}" \
            OCI_ARCHIVE=/tmp/image.tar \
            DOCKER_BUILD_FLAGS="--platform=${IMAGE_PLATFORMS}"

      - name: Save container as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container
          path: /tmp/image.tar
          if-no-files-found: error

  test:
    name: Unit test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Ensure go module files are up-to-date
        run: |
          go mod tidy
          diff=$(git diff --color -- go.mod go.sum)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "***** go modules are out-of-date *****"
            echo "*****     run 'go mod tidy'      *****"
            exit 1
          fi

      - name: Run unit tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: cover.out

  e2e:
    name: End-to-end
    needs: [build, test]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # There must be kindest/node images for these versions
        # See: https://hub.docker.com/r/kindest/node/tags?page=1&ordering=last_updated
        # OpenShift dates: https://access.redhat.com/support/policy/updates/openshift#dates
        KUBERNETES_VERSIONS:
          - "1.20.15"  # Oldest that is expected to work
          # - "1.21.14"
          # - "1.22.17"
          # - "1.23.17"
          - "1.24.17"  # OCP 4.11
          - "1.25.16"  # OCP 4.12 until 2026-01-17
          # - "1.26.15"  # OCP 4.13 until 2024-11-17
          - "1.27.13"  # OCP 4.14 until 2026-10-31
          - "1.28.9"   # OCP 4.15 until 2025-08-27
          - "1.29.14"  # OCP 4.16 until 2027-06-27
          - "1.30.10"  # OCP 4.17 until 2026-04-01
          - "1.31.6"   # OCP 4.18 until 2028-02-25
          - "1.32.3"   # OCP 4.19
          - "1.33.0"   # OCP 4.20

    env:
      KUBECONFIG: /tmp/kubeconfig
      KUBERNETES_VERSION: ${{ matrix.KUBERNETES_VERSIONS }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        run: make helm

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v${KUBERNETES_VERSION}/bin/linux/amd64/kubectl"
          sudo install ./kubectl /usr/local/bin/
          kubectl version --client
          kubectl version --client | grep -q ${KUBERNETES_VERSION}

      - name: Install kind
        run: |
          curl -L -o kind https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64
          sudo install ./kind /usr/local/bin && rm kind
          kind version
          kind version | grep -q ${KIND_VERSION}

      - name: Create Kubernetes cluster
        run: |
          ./hack/setup-kind-cluster.sh "${KUBERNETES_VERSION}"

      - name: Load container artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container
          path: /tmp

      - name: Import container image
        # Kind loads the archive under the full image name embedded at build
        # time (${IMAGE}:${CI_TAG}), which must match the chart's
        # image.repository plus the tagOverride below.
        run: kind load image-archive /tmp/image.tar

      - name: Start operator
        run: |
          bin/helm install --create-namespace -n backube-snapscheduler \
              --set image.repository="${IMAGE}" \
              --set image.tagOverride="${CI_TAG}" \
              --set metrics.disableAuth=true \
              --wait --timeout=300s \
              snapscheduler ./helm/snapscheduler
          kubectl -n backube-snapscheduler get all

      - name: Run e2e tests
        run: make test-e2e

  # This stable gate provides a single CI check for Mergify and branch
  # protection, independent of the e2e matrix size, and prevents publishing
  # images before all prerequisites succeed. Keep `needs` and the result checks
  # below in sync.
  e2e-success:
    name: Successful e2e tests
    needs: [build, e2e, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Required job 'build' did not succeed (result: $BUILD_RESULT)"
            exit 1
          fi
          if [ "$E2E_RESULT" != "success" ]; then
            echo "::error::Required job 'e2e' did not succeed (result: $E2E_RESULT)"
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::Required job 'lint' did not succeed (result: $LINT_RESULT)"
            exit 1
          fi
          echo "Previous steps were successful"

  push:
    name: Push container to registry
    needs: [e2e-success]
    if: >
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    # The image is published from the OCI archive with skopeo, so this job does
    # not depend on the runner's Docker (containerd) image store.
    runs-on: ubuntu-24.04

    steps:
      - name: Load container artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container
          path: /tmp

      - name: Login to registry
        # If the registry server is specified in the image name, we use that.
        # If the server isn't in the image name, default to docker.io
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          [[ "${IMAGE}" =~ ^([^/]+)/[^/]+/[^/]+ ]] && REGISTRY="${BASH_REMATCH[1]}" || REGISTRY="docker.io"
          echo "Attempting skopeo login to: ${REGISTRY}"
          printf '%s\n' "${REGISTRY_PASSWORD}" | skopeo login \
            --authfile "${RUNNER_TEMP}/containers-auth.json" \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin "${REGISTRY}"

      - name: Publish and verify multi-platform image
        run: |
          AUTHFILE="${RUNNER_TEMP}/containers-auth.json"
          # Keep this list independent of IMAGE_PLATFORMS: it is the supported
          # platform contract that the published tag must satisfy.
          EXPECTED_PLATFORMS="linux/amd64 linux/arm64 linux/s390x linux/ppc64le"

          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAG="latest"
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\..*) ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            echo "::error::No publish tag for ${GITHUB_REF}"
            exit 1
          fi

          echo "Publishing ${IMAGE}:${TAG} from the OCI archive"
          skopeo --version
          skopeo copy --all \
            --authfile "${AUTHFILE}" \
            "oci-archive:/tmp/image.tar:${CI_TAG}" \
            "docker://${IMAGE}:${TAG}"

          # Assert the registry's view of the pushed tag, not the local archive.
          skopeo inspect --raw \
            --authfile "${AUTHFILE}" \
            "docker://${IMAGE}:${TAG}" > /tmp/index.json

          # BuildKit attestation entries are not platforms; drop them.
          ACTUAL_PLATFORMS=$(jq -r '[.manifests[]? | select((.platform.architecture // "unknown") != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | unique | join(" ")' /tmp/index.json)

          if ! jq -e '(.manifests | length) > 0' /tmp/index.json > /dev/null; then
            echo "::error::${IMAGE}:${TAG} is not a multi-platform image index"
            echo "Expected platforms: ${EXPECTED_PLATFORMS}"
            echo "Actual platforms:   ${ACTUAL_PLATFORMS:-<none>}"
            echo "Registry index for ${IMAGE}:${TAG}:"
            cat /tmp/index.json
            exit 1
          fi

          MISSING_PLATFORMS=""
          for PLATFORM in ${EXPECTED_PLATFORMS}; do
            case " ${ACTUAL_PLATFORMS} " in
              *" ${PLATFORM} "*) ;;
              *) MISSING_PLATFORMS="${MISSING_PLATFORMS} ${PLATFORM}" ;;
            esac
          done

          if [ -n "${MISSING_PLATFORMS}" ]; then
            echo "::error::${IMAGE}:${TAG} is missing expected platforms:${MISSING_PLATFORMS}"
            echo "Expected platforms: ${EXPECTED_PLATFORMS}"
            echo "Actual platforms:   ${ACTUAL_PLATFORMS}"
            echo "Registry index for ${IMAGE}:${TAG}:"
            cat /tmp/index.json
            exit 1
          fi

          echo "Success: ${IMAGE}:${TAG} contains all expected platforms: ${ACTUAL_PLATFORMS}"
